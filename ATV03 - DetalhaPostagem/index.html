
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalha Postagem</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }

        .post {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            background-color: #f1f5f5;
        }

        .post:hover {
            background-color: #e9e9e9;
        }

        #detalhes {
            margin-top: 30px;
        }

        .comentario {
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            background-color: #fafafa;
        }
    </style>
</head>

<body>

    <h1>Detalha Postagem</h1>

    <label><strong>Usuário:</strong></label>

    <select id="usuarios">
        <option value="">Selecione um usuário</option>
    </select>
    <div id="retorno"></div>  
    <div id="posts"></div>
    <div id="detalhes"></div>
    <script src="script.js"></script>

</body>
</html>
